# /etc/nginx/sites-available/designfactor — reverse proxy перед uvicorn.
# Интерфейс (frontend/) раздаёт сам backend (app.mount("/") в app/main.py),
# поэтому отдельной статики в nginx нет: всё проксируется на 127.0.0.1:8811.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Шаблоны .pptx с фото бывают очень тяжёлыми; client_body_timeout — на
    # медленный канал клиента (иначе nginx отвечает 408, а backend запроса не видит).
    client_max_body_size 200M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Превью и экспорт ждут очереди LibreOffice — дольше стандартных 60 с.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

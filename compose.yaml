name: designfactor

services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      STORAGE_DIR: /app/backend/storage
      SKILLS_DIR: /app/backend/skills
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/backend/storage
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  storage:

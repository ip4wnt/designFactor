# Скилл «Валидация контента» (Приложение 1 ТЗ): 11 вопросов да/нет к VLM по PNG
# слайда. Используется audit.audit_content_with_vlm. Порядок вопросов = ключи q1..q11;
# skip_for_structural — вопросы, которые не задаются обложке/разделителю/финалу.
name: visual_audit
version: 1.0.0
model_name: null
system_prompt: |
  Ты — контроль качества деловых презентаций. На вход — картинка одного слайда. Ответь на каждый из перечисленных вопросов da/net (true/false в JSON), строго по тому, что видно на картинке — не придумывай контекст, которого там нет. Для каждого вопроса, где ответ false, добавь короткое поле <key>_reason с объяснением в одно предложение. Ответ — СТРОГО JSON-объект с ключами q1..q11 (boolean) и опциональными *_reason (string), без markdown-обёртки.
questions:
- key: q1
  text: Заголовок содержит вывод, а не просто называет тему?
- key: q2
  text: Содержимое слайда соответствует заголовку?
- key: q3
  text: Слайд пересказывается одним предложением?
- key: q4
  text: Все цифры и факты со слайда выглядят взаимно согласованными (не противоречат друг другу)?
- key: q5
  text: На слайде есть содержание, а не только заголовок?
- key: q6
  text: Картинки и иконки (если есть) относятся к теме слайда?
- key: q7
  text: 'Нет служебного мусора: реплик спикера, кусков промпта, технических артефактов?'
- key: q8
  text: Текст без опечаток?
- key: q9
  text: Текст на слайде на одном языке (без случайного смешения языков; названия брендов, аббревиатуры, ссылки и термины вроде IT, VK, AI — не считаются смешением)?
- key: q10
  text: Все строки таблицы и элементы легенды (если есть) работают на мысль слайда, а не случайны?
- key: q11
  text: Слайд логично мог бы стоять в деловой презентации на заявленную тему?
skip_for_structural:
- q1
- q3
- q5
- q11

# Скилл «Текстовые исправления по аудиту»: LLM сокращает тезисы, на которых
# аудит нашёл bullet_too_long / too_many_bullets. Используется audit_fix.py;
# при недоступной модели работает детерминированный запасной вариант.
name: audit_text_fix
version: 1.0.0
model_name: null
temperature: 0.2
max_words_per_bullet: 14
max_bullets: 6
rewrite_system_prompt: |
  Ты редактор деловых презентаций. Сократи каждый тезис до 14 слов и короче, сохранив смысл, цифры и термины. Не добавляй новых фактов. Верни JSON {"texts": [...]} — по одной строке на каждый входной тезис, в том же порядке.
condense_system_prompt: |
  Ты редактор деловых презентаций. Объедини и сократи список тезисов до 6 пунктов и меньше, каждый пункт до 14 слов, сохранив ключевые цифры и смысл. Верни JSON {"bullets": [...]}.

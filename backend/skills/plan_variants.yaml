# Скилл «Три варианта плана выступления»: один и тот же смысл, три разные логики рассказа.
name: plan_variants
version: "1.1.0"
model_name: null
angles:
  A:
    name: "От проблемы к решению"
    description: "Показываем, почему пора что-то менять, и подводим к понятному первому шагу."
    instruction: |
      Логика рассказа: контекст и проблема → цена проблемы → решение → как оно работает → риски и границы → решение, которое нужно принять.
  B:
    name: "Сначала главный вывод"
    description: "Начинаем с предложения и результата. Дальше — основания, доказательства и критерии успеха."
    instruction: |
      Логика рассказа: сразу главный вывод и предложение → почему именно так (аргументы и доказательства) → что мы получим → условия, риски и критерии успеха → следующий шаг.
  C:
    name: "Через вопросы и возражения"
    description: "Строим рассказ вокруг сомнений аудитории и показываем, как предложение снимает неопределенность."
    instruction: |
      Логика рассказа: какие вопросы и возражения у этой аудитории возникнут → ответ на каждый из них фактами → что остается неопределенным и как мы это проверим → решение и следующий шаг.
extra_rules: |
  source_table_id выбирай только из списка «Разрешенные source_table_id для вставки»
  и значений, разрешенных JSON Schema. Если список пуст, везде ставь null.
  Если выбран source_table_id, не создавай блоки table или chart, даже пустые:
  оставь только текстовые блоки; таблицу или готовую диаграмму добавит сервер.
  Если в материалах есть каталог таблиц, любые таблицы на слайдах должны
  поступать только через source_table_id. Нельзя заполнять ячейки или данные
  графиков самостоятельно, включая примерные числа и заглушки.
  Если общий анализ не завершился и готовых результатов нет, не пытайся вставить
  большую исходную таблицу и не рассчитывай сводку самостоятельно. Построй рассказ
  по доступному тексту, а недостающие расчеты явно отметь в data_gap.
  Не объявляй лидеров, рост, падение или причины изменений без подтверждения
  в готовых результатах. Упоминание города в превью таблицы не означает лидерство.
  Исходные таблицы из каталога выбирай только если они нужны рассказу:
  укажи source_table_id дословно из каталога. Не переписывай ячейки в content_blocks:
  сервер вставит точные заголовки и строки. Не агрегируй, не сокращай и не превращай
  такую таблицу в график. Не выбирай недоступные таблицы. Для остальных слайдов
  source_table_id = null. Исходная таблица допустима только на внутреннем слайде,
  максимум одна на слайд. Добавь содержательный заголовок и при необходимости текст.
  Если есть общий анализ таблиц, используй его готовые результаты наравне с исходными:
  source_table_id результата дословно из каталога; сервер вставит рассчитанные ячейки.
  Учитывай recommended_presentation и presentation_reason аналитика при выборе
  результатов для рассказа: таблица показывает точные значения, диаграмма -
  сравнение, динамику или части целого. По ID сервер вставит рекомендованный вид
  с точными данными. Не переписывай числа и не меняй тип готовой диаграммы сам.
  Подбирай нужные результаты под логику рассказа, все вставлять необязательно.
  Явное требование автора к таблицам и графикам обязательно для КАЖДОГО варианта:
  выбери соответствующие source_table_id, а не заменяй визуализации текстом.
  Для выводов используй точные данные из общего анализа, не вычисляй новые показатели сам.
  Учитывай указанные ограничения и методику. Если анализ не завершился, не имитируй
  недостающие расчеты: используй только готовые результаты или укажи data_gap.
  data_note оставь пустым: сервер заполнит происхождение данных.
  Дополнительно к правилам выше, для КАЖДОГО слайда заполни два поля:
  - why — одно-два предложения: как именно этот слайд работает на цель презентации и раскрывает главную идею
    (не пересказ слайда, а его роль в рассказе; до 200 знаков);
  - data_gap — пустая строка, если фактов для слайда достаточно. Если для сильного слайда не хватает исходных
    данных (цифры, сроки, примеры, названия), напиши коротко, каких именно данных нет, начиная со слов «Нужны данные:».
    Недостающие цифры и факты не выдумывай: оставь осторожную формулировку без цифр и укажи это в data_gap.
  Поле story — одно предложение (до 180 знаков) о том, как построен рассказ именно в этом варианте для этой темы.
  Слайды должны раскрывать главную идею и вести аудиторию к ожидаемому решению. Заголовки — тезисы, а не названия тем.
  Не используй букву «ё» — пиши «е».
user_prompt_template: |
  Главная идея презентации: {idea}
  Для кого: {audience}
  Что аудитория должна решить или сделать: {goal}
  Тон изложения: {tone}
  Что обязательно должно быть на слайдах: {must}

  Тема и описание от автора:
  {topic}

  Материалы (фрагменты):
  {materials}

  Целевое число слайдов: {slide_count}

  {angle_instruction}
  {extra}
  Составь план выступления строго по правилам из system prompt.
